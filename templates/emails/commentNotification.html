<div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; background-color: #f4f7f6; padding: 20px;">
  <div style="background-color: white; border-radius: 8px; padding: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h3 style="color: #007bff;">New Comment on Your Post!</h3>
    <hr style="border: 0; border-top: 1px solid #eee;">
    <p style="font-size: 16px;"><strong>{{commenterName}}</strong> commented on your post:</p>
    <div style="background-color: #f8f9fa; border-left: 4px solid #007bff; padding: 15px; font-style: italic; margin: 20px 0;">
      "{{postTitle}}"
    </div>
  </div>
</div>
