<div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; border: 1px solid #ddd; padding: 20px;">
  <h2 style="color: #333; text-align: center;">Reset Your Password</h2>
  <p>Hi {{name}},</p>
  <p>You requested to reset your password. Please use the token below to set a new one:</p>
  
  <div style="text-align: center; margin: 30px 0; background-color: #f8f9fa; border: 1px dashed #007bff; padding: 15px; border-radius: 5px;">
    <span style="font-size: 20px; font-weight: bold; color: #007bff; letter-spacing: 2px;">{{resetToken}}</span>
  </div>

  <p>Copy and paste this token in the reset password page. It is valid for 10 minutes.</p>
  <p>If you didn't request this, please ignore this email.</p>
  <hr style="border: 0; border-top: 1px solid #eee;">
  <p style="font-size: 12px; color: #888; text-align: center;">Social App Team</p>
</div>
