<div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; border: 1px solid #ddd; border-radius: 12px;">
  <div style="padding: 20px; border-bottom: 1px solid #eee;">
    <h3 style="color: #333;">Someone replied to your comment</h3>
  </div>
  <div style="padding: 20px;">
    <p><strong>{{replierName}}</strong> replied to your comment on a post:</p>
    <p style="color: #666; font-size: 14px; margin-bottom: 5px;">Your comment:</p>
    <p style="background: #f1f1f1; padding: 10px; border-radius: 5px; font-size: 14px;">{{originalComment}}</p>
    
    <p style="color: #666; font-size: 14px; margin-top: 15px; margin-bottom: 5px;">Their reply:</p>
    <p style="background: #e7f3ff; padding: 10px; border-radius: 5px; font-size: 14px;">{{commentPreview}}</p>
  </div>
</div>
